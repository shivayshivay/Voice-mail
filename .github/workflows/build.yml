name: Build APK and deploy Edge Function

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if pushed as a zip)
        run: |
          if [ -f AIVoicemail.zip ]; then
            unzip -o AIVoicemail.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle -p AIVoicemail assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIVoicemail-debug-apk
          path: AIVoicemail/app/build/outputs/apk/debug/app-debug.apk

  deploy-function:
    runs-on: ubuntu-latest
    # Only runs once you've added the two secrets below (Settings > Secrets and variables >
    # Actions). Until then this job is skipped -- the APK still builds fine without it.
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if pushed as a zip)
        run: |
          if [ -f AIVoicemail.zip ]; then
            unzip -o AIVoicemail.zip -d .
          fi

      - name: Deploy process-call function
        working-directory: AIVoicemail
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase@latest functions deploy process-call \
            --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

name: Build APK and deploy Edge Functions

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if pushed as a zip)
        run: |
          if [ -f AIVoicemail.zip ]; then
            unzip -o AIVoicemail.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle -p AIVoicemail assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIVoicemail-debug-apk
          path: AIVoicemail/app/build/outputs/apk/debug/app-debug.apk

  deploy-function:
    needs: build-apk
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if pushed as a zip)
        run: |
          if [ -f AIVoicemail.zip ]; then
            unzip -o AIVoicemail.zip -d .
          fi

      - name: Check required secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not set as repo secrets."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy process-call
        working-directory: AIVoicemail
        run: supabase functions deploy process-call --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy respond-to-turn
        working-directory: AIVoicemail
        run: supabase functions deploy respond-to-turn --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
